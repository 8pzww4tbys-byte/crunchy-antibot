# crunchy antibot — isolated Nginx reverse proxy.
#
# Include this file from /etc/nginx/sites-enabled. The rate-limit zones have
# unique names so they do not collide with other sites on the same server.
#
# HTTP is used for ACME HTTP-01 and redirects to HTTPS. TLS certificates are
# issued with:
#   certbot certonly --webroot -w /var/www/certbot -d 2-26-84-26.sslip.io

limit_req_zone $binary_remote_addr zone=crunchy_ab_static:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=crunchy_ab_api:10m rate=90r/m;
limit_req_zone $binary_remote_addr zone=crunchy_ab_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=crunchy_ab_support:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=crunchy_ab_conn:10m;

upstream crunchy_ab_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 2-26-84-26.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 2-26-84-26.sslip.io;

    ssl_certificate /etc/letsencrypt/live/2-26-84-26.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2-26-84-26.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:crunchy_ab_ssl:10m;
    ssl_session_timeout 1d;

    # The app enforces its own limit too; this is the outer layer.
    limit_conn crunchy_ab_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Registration/login/admin login: strict per-IP bucket, with a small
    # burst so a normal user flow (register, logout, login) is not throttled.
    location ~ ^/api/(?:register|login|logout|admin/(?:login|logout))$ {
        limit_req zone=crunchy_ab_auth burst=6 nodelay;
        proxy_pass http://crunchy_ab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/support {
        limit_req zone=crunchy_ab_support burst=2 nodelay;
        proxy_pass http://crunchy_ab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=crunchy_ab_api burst=20 nodelay;
        proxy_pass http://crunchy_ab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=crunchy_ab_static burst=100 nodelay;
        proxy_pass http://crunchy_ab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_request_buffering on;
    }
}
