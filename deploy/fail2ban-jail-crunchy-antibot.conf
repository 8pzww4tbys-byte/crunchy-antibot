[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1d

[crunchy-antibot]
enabled = true
filter = crunchy-antibot
logpath = /var/log/nginx/crunchy-antibot.access.log
backend = auto
maxretry = 15
findtime = 60
bantime = 1h
action = ufw
port = http,https
