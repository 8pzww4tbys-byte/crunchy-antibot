# Temporary HTTP-only config used for the first Let's Encrypt HTTP-01
# webroot challenge on crunchy.2-26-84-26.sslip.io and the legacy host.

limit_req_zone $binary_remote_addr zone=crunchy_ab_static:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=crunchy_ab_api:10m rate=90r/m;
limit_req_zone $binary_remote_addr zone=crunchy_ab_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=crunchy_ab_support:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=crunchy_ab_conn:10m;

upstream crunchy_ab_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name crunchy.2-26-84-26.sslip.io 2-26-84-26.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}
