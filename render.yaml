# Optional Render blueprint for a free demo instance.
# Render's free web service has no persistent disk and sleeps after inactivity,
# so use the VPS + systemd deployment for production data.
services:
  - type: web
    name: crunchy-antibot
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: "node server/index.mjs"
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: DATA_DIR
        value: server/data
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FREE_LIMIT
        value: "10000"
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
